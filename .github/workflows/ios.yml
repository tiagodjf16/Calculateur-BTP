# Appli iPhone du club (asf-pierrelatte/ios) : fabriquée sur les Mac de GitHub, sans Mac au club.
# 1. « compiler » : vérifie que l'appli se compile (simulateur, sans signature) à chaque changement.
name: ios
on:
  push:
    branches: [claude/modest-allen-n8rcgo]
    paths: ["asf-pierrelatte/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
concurrency:
  # un envoi TestFlight n'est jamais annulé par un push suivant ; les simples compilations, si
  group: ios-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[testflight]') || github.event_name == 'workflow_dispatch') && github.run_id || 'compil' }}
  cancel-in-progress: true
jobs:
  compiler:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: asf-pierrelatte/ios
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - name: Projet Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour le simulateur
        run: |
          set -o pipefail
          xcodebuild -project ASFPierrelatte.xcodeproj -scheme ASFPierrelatte -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee compilation.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" compilation.log

  # 2. « captures » : l'appli lancée dans deux iPhone virtuels : 17 Pro (6,3 pouces, 1206 x 2622, la taille exigée par
  #    l'App Store) et 17 Pro Max (6,9 pouces, 1320 x 2868, facultative). Elle doit démarrer et afficher le site ;
  #    les captures servent aussi pour la fiche App Store.
  captures:
    needs: compiler
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: asf-pierrelatte/ios
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26.6 et projet
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
          xcodegen generate
      - name: Compiler pour le simulateur
        run: |
          xcodebuild -project ASFPierrelatte.xcodeproj -scheme ASFPierrelatte -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build -quiet
      - name: Captures dans deux iPhone virtuels
        timeout-minutes: 30
        run: |
          prendre() {   # $1 : modèle, $2 : dossier
            UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt,l in sorted(d.items(), reverse=True):
              for x in l:
                  if x['name']=='$1' and x.get('isAvailable'): print(x['udid']); sys.exit()
          ")
            if [ -z "$UDID" ]; then echo "::warning::$1 introuvable"; return; fi
            echo "::group::$1 ($UDID)"
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/ASFPierrelatte.app
            mkdir -p "captures/$2"
            for p in accueil calendrier resultats classement compos club; do
              xcrun simctl launch --terminate-running-process "$UDID" fr.asfpierrelatte.app -page "/#$p" || echo "lancement impossible"
              sleep 14
              xcrun simctl spawn "$UDID" launchctl list | grep -qi "fr.asfpierrelatte" || echo "::warning::l'appli ne tourne plus après l'ouverture de $p ($1)"
              xcrun simctl io "$UDID" screenshot --type=png "captures/$2/$p.png" || echo "capture impossible"
            done
            xcrun simctl shutdown "$UDID" || true
            echo "::endgroup::"
          }
          prendre "iPhone 17 Pro" "6.3-pouces"
          prendre "iPhone 17 Pro Max" "6.9-pouces"
          ls -laR captures
      - uses: actions/upload-artifact@v4
        with:
          name: captures-iphone
          path: asf-pierrelatte/ios/captures
          retention-days: 30

  # 3. « testflight » : l'appli signée et envoyée sur TestFlight (App Store Connect), sans Mac au club.
  #    Seulement quand le message du commit contient [testflight], et quand les clés Apple sont dans les secrets du dépôt :
  #    APPLE_TEAM_ID, ASC_ISSUER_ID, ASC_KEY_ID, ASC_KEY_P8 (clé API App Store Connect, rôle Admin),
  #    CERTIFICATE_PRIVATE_KEY (clé RSA du certificat « Apple Distribution », créée une fois avec ssh-keygen).
  #    Avant : l'App ID fr.asfpierrelatte.app (Push Notifications + Associated Domains) et la fiche de l'appli dans App Store Connect.
  #    Le certificat et le profil App Store sont créés la première fois, puis réutilisés (codemagic-cli-tools, libre).
  testflight:
    needs: compiler
    if: contains(github.event.head_commit.message, '[testflight]') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_KEY_P8 }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: fr.asfpierrelatte.app
    defaults:
      run:
        working-directory: asf-pierrelatte/ios
    steps:
      - name: Clés Apple présentes ?
        id: cles
        working-directory: .
        run: |
          manque=""
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY TEAM_ID; do
            [ -n "${!v}" ] || manque="$manque $v"
          done
          if [ -z "$manque" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::warning title=TestFlight::Secrets GitHub manquants :$manque — envoi sauté."; fi
      - if: steps.cles.outputs.ok == '1'
        uses: actions/checkout@v5
      - name: Outils (Xcode 26.6, XcodeGen, codemagic-cli-tools)
        if: steps.cles.outputs.ok == '1'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/cm"
          "$RUNNER_TEMP/cm/bin/pip" install --quiet codemagic-cli-tools
          echo "$RUNNER_TEMP/cm/bin" >> "$GITHUB_PATH"
      - name: Projet Xcode, numéro de build qui augmente à chaque envoi
        if: steps.cles.outputs.ok == '1'
        run: |
          BUILD=$(date -u +%y%j%H%M)
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          xcodegen generate
          echo "Build $BUILD"
      - name: Prérequis chez Apple (identifiant de l'appli, fiche App Store Connect)
        if: steps.cles.outputs.ok == '1'
        run: |
          if app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --platform IOS --json > "$RUNNER_TEMP/bid.json" 2> "$RUNNER_TEMP/bid.err"; then
            python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])) else 1)" "$RUNNER_TEMP/bid.json" \
              || { echo "::error title=Identifiant manquant::Crée d'abord l'App ID $BUNDLE_ID sur developer.apple.com (Identifiers), avec Push Notifications et Associated Domains."; exit 1; }
          else echo "::warning::Vérification de l'identifiant impossible :"; cat "$RUNNER_TEMP/bid.err"; fi
          if app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json > "$RUNNER_TEMP/app.json" 2> "$RUNNER_TEMP/app.err"; then
            python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])) else 1)" "$RUNNER_TEMP/app.json" \
              || { echo "::error title=Fiche manquante::Crée d'abord la fiche de l'appli dans App Store Connect (Apps > + > New App) avec le Bundle ID $BUNDLE_ID."; exit 1; }
          else echo "::warning::Vérification de la fiche impossible :"; cat "$RUNNER_TEMP/app.err"; fi
      - name: Signature (certificat Apple Distribution et profil App Store)
        if: steps.cles.outputs.ok == '1'
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --platform IOS --type IOS_APP_STORE --create --strict-match-identifier
          keychain add-certificates
          xcode-project use-profiles --project ASFPierrelatte.xcodeproj
      - name: Fabriquer l'appli (.ipa)
        if: steps.cles.outputs.ok == '1'
        run: |
          xcode-project build-ipa --project ASFPierrelatte.xcodeproj --scheme ASFPierrelatte --config Release
          ls -la build/ios/ipa
      - name: Vérifier les droits (notifications en production, liens universels)
        if: steps.cles.outputs.ok == '1'
        run: |
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -q build/ios/ipa/*.ipa -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements - --xml "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/droits.plist" 2>/dev/null || codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/droits.plist"
          plutil -p "$RUNNER_TEMP/droits.plist"
          grep -q "production" "$RUNNER_TEMP/droits.plist"
          grep -q "applinks:asf-pierrelatte.fr" "$RUNNER_TEMP/droits.plist"
      - name: Envoyer sur App Store Connect (TestFlight)
        if: steps.cles.outputs.ok == '1'
        run: app-store-connect publish --path "$(ls build/ios/ipa/*.ipa | head -1)"
      - name: Nettoyer le trousseau
        if: always() && steps.cles.outputs.ok == '1'
        run: keychain use-login || true
