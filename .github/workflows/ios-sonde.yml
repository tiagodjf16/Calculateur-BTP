# Sonde : quelles versions de Xcode les Mac de GitHub proposent (appli iPhone du club, asf-pierrelatte/ios)
name: ios-sonde
on:
  push:
    branches: [claude/modest-allen-n8rcgo]
    paths: [".github/workflows/ios-sonde.yml"]
  workflow_dispatch:
jobs:
  sonde:
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes | head -20
          which xcodegen || echo "pas de xcodegen"
          brew --version | head -1
